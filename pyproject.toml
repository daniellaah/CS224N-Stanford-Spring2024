[project]
name = "cs224n-stanford-winter2026"
version = "0.1.0"
description = "Unified uv environment for CS224N Winter 2026 course materials and assignments."
requires-python = ">=3.12,<3.13"
dependencies = [
  "datasets==2.18.0",
  "docopt>=0.6.2",
  "einops>=0.6.0",
  "gensim>=4.3.0",
  "google-genai>=1.0.0",
  "huggingface-hub>=0.14.0",
  "ipykernel>=6.29.0",
  "jaxtyping>=0.2.0",
  "jupyterlab>=4.0.0",
  "matplotlib>=3.7.0",
  "numpy>=1.24.0",
  "openai>=1.0.0",
  "pytest>=7.3.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "scikit-learn>=1.4.0",
  "scipy>=1.11.0",
  "torch>=2.1.2",
  "torchvision>=0.16.0",
  "tqdm>=4.65.0",
  "transformers>=4.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
